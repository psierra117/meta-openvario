#@TYPE: Machine
#@NAME: CubieBoard2 HDMI
#@DESCRIPTION: Machine configuration for the CubieBoard2 with the HDMI test display target.

require ov-cubieboard2.inc

# Machine-specific files (U-Boot per_machine.cfg, font.env) live in
# ov-cb2-hdmi/ directories. Add the override explicitly so they are also
# found when building through the legacy alias MACHINE = "ov-hdmi".
MACHINEOVERRIDES =. "ov-cb2-hdmi:"

KERNEL_DEVICETREE = "ov-hdmi.dtb"

SHORT_OV_MACHINE = "CB2-HDMI"
